<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>extension_base</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --card: #f7f5fb;
      --border: #ebe6f5;
      --text: #1f1b2e;
      --muted: #7a7488;
      --accent: #7c3aed;
      --accent-dark: #6d28d9;
    }

    * { box-sizing: border-box; }

    html {
      width: 300px;
    }

    body {
      width: 300px;
      margin: 0;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      text-align: center;
      margin-bottom: 14px;
    }

    #queue-count {
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      margin: 0;
      color: var(--accent-dark);
    }

    #queue-status {
      font-size: 12.5px;
      color: var(--muted);
      margin: 6px 0 0;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.05s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    #btn-action {
      background: var(--accent);
      color: #ffffff;
    }

    #btn-action:hover {
      background: var(--accent-dark);
    }

    #btn-show-popup {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    #btn-show-popup:hover {
      background: var(--card);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17141f;
        --card: #211d2e;
        --border: #322c42;
        --text: #f2eefb;
        --muted: #9d97ad;
        --accent: #9061f9;
        --accent-dark: #a878ff;
      }
    }
  </style>
</head>
<body id="ext-root">
  <div class="header">
    <h3>aespa SH support</h3>
  </div>

  <div class="card">
    <p id="queue-count">-</p>
    <p id="queue-status">Checking...</p>
  </div>

  <div class="actions">
    <button id="btn-action">Refresh</button>
    <button id="btn-show-popup">Show popup</button>
  </div>

  <script type="module" src="src/popup.js"></script>
</body>
</html>
